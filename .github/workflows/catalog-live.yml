name: live catalog

# Rebuilds catalog/live.json, the live game catalog every Jobee'sLair reads at launch (app/state/feeds.js
# LIVE_FEED), from the public Pegasus catalogs (tools/catalog/live-feed.mjs), every three hours and whenever the
# builder changes, and commits it when what it lists changed. A game added to a Pegasus catalog reaches every
# console the next time the app starts, without a new Jobee'sLair.
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/catalog/live-feed.mjs
      - tools/catalog/ratings.mjs

permissions:
  contents: write

concurrency:
  group: catalog-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The store ratings first (new games, and a slice of the stale ones), so the catalog carries them.
      - name: Refresh the store ratings
        run: node tools/catalog/ratings.mjs
      - name: Build the live catalog
        run: node tools/catalog/live-feed.mjs
      # catalog/ only: app/data/ratings.js, the copy a release bundles, changes with a release.
      - name: Commit it when it changed
        run: |
          git checkout -- app/data/ratings.js 2>/dev/null || true
          if git diff --quiet -- catalog/; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/live.json catalog/names.json catalog/ratings.json catalog/first-seen.json catalog/art.json
          git commit -m "catalog: refresh the live catalog [skip ci]"
          git pull --rebase origin main
          git push
