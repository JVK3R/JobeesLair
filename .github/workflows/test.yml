name: test

# The app's logic and screen tests (tests/, run with npm) on every branch push and pull request. They need only
# Node: no console, no toolchain. The build workflow (build.yml) and the beta workflow (beta.yml) run
# them again before they build anything. A release's tag is left out: publishing the draft pushes it onto a
# commit already tested on main, and a second run there only adds a second check to the same commit.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic tests
        run: npm test
      - name: Screen tests
        run: npm run test:render
